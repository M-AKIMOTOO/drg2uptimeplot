[package]
name = "drg2uptimeplot"
version = "0.3.0"
edition = "2024"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
eframe = "0.32.0"
egui_plot = "0.33.0"
astro = "2.0.0"

nav-types     = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
